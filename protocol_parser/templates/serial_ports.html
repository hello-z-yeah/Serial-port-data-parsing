<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>串口管理 - 串口协议解析器监控</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">串口协议解析器监控</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/dashboard">仪表板</a>
                <a class="nav-link active" href="/serial-ports">串口管理</a>
                <a class="nav-link" href="/plugins">插件管理</a>
                <a class="nav-link" href="/system">系统监控</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5>串口管理</h5>
                        <button class="btn btn-primary" onclick="refreshSerialPorts()">刷新</button>
                    </div>
                    <div class="card-body">
                        <div id="serial-ports-container">
                            <!-- 串口列表将在这里动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        
        // 页面加载时获取串口状态
        window.onload = function() {
            fetchSerialPorts();
        };
        
        // 实时更新串口状态
        socket.on('real_time_update', function(data) {
            if (data.serial_ports) {
                updateSerialPortsDisplay(data.serial_ports);
            }
        });
        
        function fetchSerialPorts() {
            fetch('/api/serial-ports/status')
                .then(response => response.json())
                .then(data => {
                    updateSerialPortsDisplay(data);
                })
                .catch(error => {
                    console.error('获取串口状态失败:', error);
                });
        }
        
        function updateSerialPortsDisplay(ports) {
            const container = document.getElementById('serial-ports-container');
            container.innerHTML = '';
            
            if (Object.keys(ports).length === 0) {
                container.innerHTML = '<p class="text-muted">暂无串口设备</p>';
                return;
            }
            
            for (const [portId, portStatus] of Object.entries(ports)) {
                const portCard = document.createElement('div');
                portCard.className = 'card mb-3';
                
                const statusColor = portStatus.is_connected ? 'success' : 'danger';
                const statusText = portStatus.is_connected ? '已连接' : '未连接';
                const runningColor = portStatus.is_running ? 'success' : 'warning';
                const runningText = portStatus.is_running ? '运行中' : '已停止';
                
                portCard.innerHTML = `
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="mb-0">串口 ${portId}</h6>
                            <div>
                                <span class="badge bg-${statusColor}">${statusText}</span>
                                <span class="badge bg-${runningColor} ms-2">${runningText}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <p><strong>连接状态:</strong> ${statusText}</p>
                            </div>
                            <div class="col-md-3">
                                <p><strong>运行状态:</strong> ${runningText}</p>
                            </div>
                            <div class="col-md-3">
                                <p><strong>接收数据:</strong> ${portStatus.data_received} 字节</p>
                            </div>
                            <div class="col-md-3">
                                <p><strong>发送数据:</strong> ${portStatus.data_sent} 字节</p>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-md-12">
                                <div class="btn-group" role="group">
                                    <button class="btn btn-outline-primary btn-sm" onclick="startPort('${portId}')">启动</button>
                                    <button class="btn btn-outline-warning btn-sm" onclick="stopPort('${portId}')">停止</button>
                                    <button class="btn btn-outline-info btn-sm" onclick="restartPort('${portId}')">重启</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(portCard);
            }
        }
        
        function startPort(portId) {
            fetch(`/api/serial-ports/${portId}/start`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(`串口 ${portId} 启动成功`);
                } else {
                    alert(`串口 ${portId} 启动失败`);
                }
            })
            .catch(error => {
                console.error('启动串口失败:', error);
                alert('启动串口失败');
            });
        }
        
        function stopPort(portId) {
            fetch(`/api/serial-ports/${portId}/stop`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(`串口 ${portId} 停止成功`);
                } else {
                    alert(`串口 ${portId} 停止失败`);
                }
            })
            .catch(error => {
                console.error('停止串口失败:', error);
                alert('停止串口失败');
            });
        }
        
        function restartPort(portId) {
            if (confirm(`确定要重启串口 ${portId} 吗？`)) {
                fetch(`/api/serial-ports/${portId}/restart`, {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert(`串口 ${portId} 重启成功`);
                    } else {
                        alert(`串口 ${portId} 重启失败`);
                    }
                })
                .catch(error => {
                    console.error('重启串口失败:', error);
                    alert('重启串口失败');
                });
            }
        }
        
        function refreshSerialPorts() {
            fetchSerialPorts();
        }
    </script>
</body>
</html>
