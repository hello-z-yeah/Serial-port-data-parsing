<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插件管理 - 串口协议解析器监控</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">串口协议解析器监控</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/dashboard">仪表板</a>
                <a class="nav-link" href="/serial-ports">串口管理</a>
                <a class="nav-link active" href="/plugins">插件管理</a>
                <a class="nav-link" href="/system">系统监控</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5>插件管理</h5>
                        <button class="btn btn-primary" onclick="refreshPlugins()">刷新</button>
                    </div>
                    <div class="card-body">
                        <div id="plugins-container">
                            <!-- 插件列表将在这里动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        
        // 页面加载时获取插件信息
        window.onload = function() {
            fetchPlugins();
        };
        
        // 实时更新插件状态
        socket.on('real_time_update', function(data) {
            if (data.plugins) {
                updatePluginsDisplay(data.plugins);
            }
        });
        
        function fetchPlugins() {
            fetch('/api/plugins/list')
                .then(response => response.json())
                .then(data => {
                    updatePluginsDisplay(data);
                })
                .catch(error => {
                    console.error('获取插件信息失败:', error);
                });
        }
        
        function updatePluginsDisplay(plugins) {
            const container = document.getElementById('plugins-container');
            container.innerHTML = '';
            
            if (Object.keys(plugins).length === 0) {
                container.innerHTML = '<p class="text-muted">暂无插件</p>';
                return;
            }
            
            for (const [pluginId, pluginInfo] of Object.entries(plugins)) {
                const pluginCard = document.createElement('div');
                pluginCard.className = 'card mb-3';
                
                const statusColor = pluginInfo.enabled ? 'success' : 'secondary';
                const statusText = pluginInfo.enabled ? '已启用' : '已禁用';
                
                pluginCard.innerHTML = `
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="mb-0">${pluginInfo.name}</h6>
                            <div>
                                <span class="badge bg-${statusColor}">${statusText}</span>
                                <span class="badge bg-info ms-2">v${pluginInfo.version}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <p><strong>名称:</strong> ${pluginInfo.name}</p>
                            </div>
                            <div class="col-md-3">
                                <p><strong>版本:</strong> ${pluginInfo.version}</p>
                            </div>
                            <div class="col-md-3">
                                <p><strong>作者:</strong> ${pluginInfo.author}</p>
                            </div>
                            <div class="col-md-3">
                                <p><strong>状态:</strong> ${statusText}</p>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-md-8">
                                <p><strong>描述:</strong> ${pluginInfo.description || '暂无描述'}</p>
                            </div>
                            <div class="col-md-4">
                                <p><strong>加载时间:</strong> ${new Date(pluginInfo.load_time).toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-md-12">
                                <div class="btn-group" role="group">
                                    <button class="btn btn-outline-primary btn-sm" onclick="enablePlugin('${pluginId}')">启用</button>
                                    <button class="btn btn-outline-warning btn-sm" onclick="disablePlugin('${pluginId}')">禁用</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(pluginCard);
            }
        }
        
        function enablePlugin(pluginId) {
            fetch(`/api/plugins/${pluginId}/enable`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(`插件 ${pluginId} 启用成功`);
                } else {
                    alert(`插件 ${pluginId} 启用失败`);
                }
            })
            .catch(error => {
                console.error('启用插件失败:', error);
                alert('启用插件失败');
            });
        }
        
        function disablePlugin(pluginId) {
            fetch(`/api/plugins/${pluginId}/disable`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(`插件 ${pluginId} 禁用成功`);
                } else {
                    alert(`插件 ${pluginId} 禁用失败`);
                }
            })
            .catch(error => {
                console.error('禁用插件失败:', error);
                alert('禁用插件失败');
            });
        }
        
        function refreshPlugins() {
            fetchPlugins();
        }
    </script>
</body>
</html>
