<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表板 - 串口协议解析器监控</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">串口协议解析器监控</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/dashboard">仪表板</a>
                <a class="nav-link" href="/serial-ports">串口管理</a>
                <a class="nav-link" href="/plugins">插件管理</a>
                <a class="nav-link" href="/system">系统监控</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>系统概览</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h5 class="card-title">CPU使用率</h5>
                                        <p class="card-text display-4" id="cpu-usage">0%</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h5 class="card-title">内存使用率</h5>
                                        <p class="card-text display-4" id="memory-usage">0%</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h5 class="card-title">活跃连接</h5>
                                        <p class="card-text display-4" id="active-connections">0</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h5 class="card-title">运行时间</h5>
                                        <p class="card-text display-4" id="uptime">0s</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>CPU使用率</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="cpu-chart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>内存使用率</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="memory-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>网络流量</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="network-chart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>磁盘使用率</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="disk-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        
        // 图表初始化
        const cpuChart = new Chart(document.getElementById('cpu-chart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'CPU使用率',
                    data: [],
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });
        
        const memoryChart = new Chart(document.getElementById('memory-chart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: '内存使用率',
                    data: [],
                    borderColor: 'rgb(255, 99, 132)',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });
        
        const networkChart = new Chart(document.getElementById('network-chart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: '发送',
                    data: [],
                    borderColor: 'rgb(54, 162, 235)',
                    tension: 0.1
                }, {
                    label: '接收',
                    data: [],
                    borderColor: 'rgb(255, 206, 86)',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
        
        const diskChart = new Chart(document.getElementById('disk-chart'), {
            type: 'doughnut',
            data: {
                labels: ['已使用', '可用'],
                datasets: [{
                    data: [0, 100],
                    backgroundColor: [
                        'rgb(255, 99, 132)',
                        'rgb(54, 162, 235)'
                    ]
                }]
            },
            options: {
                responsive: true
            }
        });
        
        // 实时数据更新
        socket.on('real_time_update', function(data) {
            if (data.system) {
                document.getElementById('cpu-usage').textContent = data.system.cpu_usage.toFixed(1) + '%';
                document.getElementById('memory-usage').textContent = data.system.memory_usage.toFixed(1) + '%';
                document.getElementById('active-connections').textContent = data.system.active_connections;
                
                const now = new Date(data.system.timestamp * 1000).toLocaleTimeString();
                
                // 更新CPU图表
                cpuChart.data.labels.push(now);
                cpuChart.data.datasets[0].data.push(data.system.cpu_usage);
                if (cpuChart.data.labels.length > 50) {
                    cpuChart.data.labels.shift();
                    cpuChart.data.datasets[0].data.shift();
                }
                cpuChart.update();
                
                // 更新内存图表
                memoryChart.data.labels.push(now);
                memoryChart.data.datasets[0].data.push(data.system.memory_usage);
                if (memoryChart.data.labels.length > 50) {
                    memoryChart.data.labels.shift();
                    memoryChart.data.datasets[0].data.shift();
                }
                memoryChart.update();
                
                // 更新网络图表
                networkChart.data.labels.push(now);
                networkChart.data.datasets[0].data.push(data.system.network_sent);
                networkChart.data.datasets[1].data.push(data.system.network_received);
                if (networkChart.data.labels.length > 50) {
                    networkChart.data.labels.shift();
                    networkChart.data.datasets[0].data.shift();
                    networkChart.data.datasets[1].data.shift();
                }
                networkChart.update();
                
                // 更新磁盘图表
                diskChart.data.datasets[0].data = [data.system.disk_usage, 100 - data.system.disk_usage];
                diskChart.update();
            }
        });
    </script>
</body>
</html>
